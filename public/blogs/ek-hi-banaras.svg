<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">एक ही बनारस</title>
  <desc id="desc">Two people on the ghats and lanes of Banaras: one pausing to admire the beauty, the other rushing with work.</desc>
  <defs>
    <!-- Sky Morning/Evening Glow Gradient -->
    <linearGradient id="banarasSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19152b"/>
      <stop offset="35%" stop-color="#4a223b"/>
      <stop offset="65%" stop-color="#9a3424"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- River Ganga Gradient -->
    <linearGradient id="gangaWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#b45309"/>
      <stop offset="55%" stop-color="#451a24"/>
      <stop offset="100%" stop-color="#1c101c"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="templeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#banarasSky)"/>

  <!-- Sun Rising / Setting over Ganga -->
  <circle cx="800" cy="460" r="140" fill="url(#sunGlow)"/>
  <circle cx="800" cy="460" r="32" fill="#fffdf0"/>

  <!-- Birds in the sky -->
  <g stroke="#3e1b24" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M 320 220 Q 330 210 340 220 Q 350 210 360 220"/>
    <path d="M 365 245 Q 373 237 381 245 Q 389 237 397 245"/>
    <path d="M 410 215 Q 418 208 426 215 Q 434 208 442 215"/>
    <path d="M 1210 190 Q 1220 180 1230 190 Q 1240 180 1250 190"/>
    <path d="M 1260 215 Q 1268 207 1276 215 Q 1284 207 1292 215"/>
  </g>

  <!-- Distant Ghat & Temple Shikhara Silhouettes -->
  <g fill="#2d1522" opacity="0.85">
    <!-- Far Temple 1 -->
    <path d="M 180 490 L 210 370 L 240 490 Z"/>
    <rect x="195" y="490" width="30" height="80"/>
    <!-- Far Temple 2 -->
    <path d="M 270 490 L 305 340 L 340 490 Z"/>
    <rect x="290" y="490" width="30" height="80"/>
    <path d="M 130 510 L 400 510 L 400 560 L 130 560 Z"/>

    <!-- Far Temple Right -->
    <path d="M 1280 490 L 1315 350 L 1350 490 Z"/>
    <rect x="1300" y="490" width="30" height="80"/>
    <path d="M 1380 490 L 1410 380 L 1440 490 Z"/>
    <rect x="1395" y="490" width="30" height="80"/>
    <path d="M 1240 510 L 1500 510 L 1500 560 L 1240 560 Z"/>
  </g>

  <!-- Foreground Ghat Buildings & Temples (Left Lane/Ghat) -->
  <g fill="#1b0e18" filter="url(#templeShadow)">
    <!-- Left Heritage Structure & Shikhara -->
    <path d="M 0 350 L 60 350 L 80 270 L 100 350 L 180 350 L 180 620 L 0 620 Z"/>
    <!-- Intricate temple dome and spire -->
    <path d="M 70 270 Q 90 200 90 190 Q 90 200 110 270 Z"/>
    <line x1="90" y1="180" x2="90" y2="200" stroke="#1b0e18" stroke-width="4"/>
    <circle cx="90" cy="180" r="4"/>
    <!-- Windows & Arches on Left -->
    <path d="M 40 420 Q 55 400 70 420 L 70 460 L 40 460 Z" fill="#9a3424" opacity="0.6"/>
    <path d="M 100 420 Q 115 400 130 420 L 130 460 L 100 460 Z" fill="#9a3424" opacity="0.6"/>
    <path d="M 40 510 Q 55 490 70 510 L 70 550 L 40 550 Z" fill="#d97706" opacity="0.4"/>
    <path d="M 100 510 Q 115 490 130 510 L 130 550 L 100 550 Z" fill="#d97706" opacity="0.4"/>

    <!-- Right Heritage Structure & Temple -->
    <path d="M 1420 320 L 1510 320 L 1530 230 L 1550 320 L 1600 320 L 1600 620 L 1420 620 Z"/>
    <path d="M 1515 230 Q 1530 160 1530 150 Q 1530 160 1545 230 Z"/>
    <line x1="1530" y1="140" x2="1530" y2="160" stroke="#1b0e18" stroke-width="4"/>
    <circle cx="1530" cy="140" r="4"/>
    <!-- Windows Right -->
    <path d="M 1470 410 Q 1485 390 1500 410 L 1500 450 L 1470 450 Z" fill="#9a3424" opacity="0.6"/>
    <path d="M 1530 410 Q 1545 390 1560 410 L 1560 450 L 1530 450 Z" fill="#9a3424" opacity="0.6"/>
    <path d="M 1470 500 Q 1485 480 1500 500 L 1500 540 L 1470 540 Z" fill="#d97706" opacity="0.4"/>
  </g>

  <!-- River Ganga Water Body -->
  <rect x="0" y="550" width="1600" height="350" fill="url(#gangaWater)"/>

  <!-- Water Reflections -->
  <g stroke="#fef08a" opacity="0.5" stroke-linecap="round">
    <line x1="740" y1="560" x2="860" y2="560" stroke-width="3"/>
    <line x1="710" y1="575" x2="890" y2="575" stroke-width="4"/>
    <line x1="680" y1="595" x2="920" y2="595" stroke-width="5"/>
    <line x1="660" y1="620" x2="940" y2="620" stroke-width="4"/>
    <line x1="690" y1="650" x2="910" y2="650" stroke-width="3"/>
    <line x1="720" y1="685" x2="880" y2="685" stroke-width="2.5"/>
  </g>

  <!-- Wooden Boats Floating on Ganga -->
  <g fill="#180c14">
    <!-- Boat 1 (Center-Left) -->
    <path d="M 480 615 Q 560 635 640 615 Q 630 638 560 638 Q 490 638 480 615 Z"/>
    <line x1="550" y1="595" x2="570" y2="630" stroke="#180c14" stroke-width="2.5"/>
    <circle cx="560" cy="590" r="5"/>

    <!-- Boat 2 (Center-Right) -->
    <path d="M 980 625 Q 1050 642 1120 625 Q 1110 645 1050 645 Q 990 645 980 625 Z"/>
    <line x1="1040" y1="608" x2="1055" y2="638" stroke="#180c14" stroke-width="2"/>
    <circle cx="1048" cy="604" r="4"/>
  </g>

  <!-- The Grand Ghat Steps (Pucca Ghat Stairs) -->
  <g fill="#150a12">
    <!-- Step 1 -->
    <polygon points="0,670 1600,670 1600,695 0,695"/>
    <!-- Step 2 -->
    <polygon points="0,705 1600,705 1600,735 0,735"/>
    <!-- Step 3 -->
    <polygon points="0,745 1600,745 1600,780 0,780"/>
    <!-- Step 4 -->
    <polygon points="0,790 1600,790 1600,900 0,900"/>

    <!-- Ghat edge highlights -->
    <line x1="0" y1="670" x2="1600" y2="670" stroke="#b45309" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="705" x2="1600" y2="705" stroke="#b45309" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="745" x2="1600" y2="745" stroke="#b45309" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="790" x2="1600" y2="790" stroke="#b45309" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- TWO PEOPLE: THE CONTRAST (Rahul vs Mahesh) -->

  <!-- RAHUL (Left side - Calm, sitting/standing on steps, camera raised looking at sunrise) -->
  <g transform="translate(340, 640)" fill="#0d060b">
    <!-- Rahul standing peacefully on ghat steps -->
    <circle cx="30" cy="18" r="14"/>
    <!-- Body with light jacket -->
    <path d="M 18 36 C 18 32, 42 32, 42 36 L 46 95 C 46 98, 14 98, 14 95 Z"/>
    <!-- Arms raised holding camera up to look at Ganga -->
    <path d="M 18 42 L 8 62 L 24 58 Z"/>
    <path d="M 42 42 L 48 58 L 36 58 Z"/>
    <!-- Camera in hands -->
    <rect x="22" y="52" width="16" height="11" rx="2" fill="#d97706"/>
    <circle cx="30" cy="57" r="3" fill="#150a12"/>
    <!-- Legs relaxed on steps -->
    <line x1="22" y1="95" x2="20" y2="148" stroke="#0d060b" stroke-width="9" stroke-linecap="round"/>
    <line x1="38" y1="95" x2="42" y2="148" stroke="#0d060b" stroke-width="9" stroke-linecap="round"/>

    <!-- Small Label Box -->
    <rect x="-40" y="165" width="140" height="30" rx="6" fill="#1f111d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="185" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fef08a">राहुल : नज़रिया व फुर्सत</text>
  </g>

  <!-- MAHESH (Right side - Hurrying forward, shoulder bag, phone to ear, looking down) -->
  <g transform="translate(1180, 630)" fill="#0d060b">
    <!-- Head tilted towards phone -->
    <circle cx="30" cy="16" r="14"/>
    <!-- Phone at ear -->
    <rect x="39" y="10" width="7" height="16" rx="1.5" fill="#f59e0b"/>
    <!-- Right Arm holding phone to ear -->
    <path d="M 42 40 L 48 24 L 40 20" stroke="#0d060b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Torso leaning forward in hurry -->
    <path d="M 16 34 C 18 30, 42 30, 44 34 L 52 92 C 52 96, 20 96, 18 92 Z"/>
    <!-- Big Sales Representative Bag across shoulder -->
    <path d="M 12 36 L 44 82" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <rect x="5" y="62" width="22" height="34" rx="4" fill="#9a3424" stroke="#d97706" stroke-width="1.5"/>
    <!-- Left Arm swinging fast -->
    <path d="M 18 40 L 6 68" stroke="#0d060b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Legs in walking/hurrying stride -->
    <line x1="26" y1="92" x2="10" y2="152" stroke="#0d060b" stroke-width="9" stroke-linecap="round"/>
    <line x1="44" y1="92" x2="62" y2="150" stroke="#0d060b" stroke-width="9" stroke-linecap="round"/>

    <!-- Small Label Box -->
    <rect x="-40" y="175" width="140" height="30" rx="6" fill="#1f111d" stroke="#f87171" stroke-width="1.5"/>
    <text x="30" y="195" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fca5a5">महेश : लक्ष्य व काम</text>
  </g>

  <!-- Center Typography Title -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Noto Sans Devanagari', Roboto, sans-serif">
    <!-- Main Title -->
    <text x="800" y="130" font-size="62" font-weight="800" fill="#fffdfa" letter-spacing="1">
      एक ही बनारस
    </text>
    <!-- Subtitle -->
    <text x="800" y="180" font-size="24" font-weight="500" fill="#fde68a" opacity="0.95">
      एक के पास कैमरा था, दूसरे के पास बिक्री का लक्ष्य
    </text>
  </g>
</svg>

