<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">AI Video Summarizer - Localhost vs Production Bot Detection Sketch</title>
  <desc id="desc">Hand-drawn technical architectural sketch illustrating YouTube bot detection, cloud server IP reputation blocking, and 5 failed mitigation attempts.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- Sketchy rough filter effect for hand-drawn pencil look -->
    <filter id="sketchyFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10b981" flood-opacity="0.3" />
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 8">
    <path d="M0 100h1600M0 200h1600M0 300h1600M0 400h1600M0 500h1600M0 600h1600M0 700h1600M0 800h1600" />
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900" />
  </g>

  <!-- MAIN SKETCHED CONTENT -->
  <g filter="url(#sketchyFilter)">

    <!-- TITLE SKETCH HEADER -->
    <g transform="translate(100, 70)">
      <text x="0" y="0" fill="#f8fafc" font-family="sans-serif" font-size="32" font-weight="bold">AI Video Summarizer Architecture</text>
      <text x="0" y="32" fill="#f59e0b" font-family="monospace" font-size="20">Localhost vs. Production YouTube Anti-Abuse Pipeline</text>
    </g>

    <!-- LEFT CARD: LOCALHOST ENVIRONMENT (SUCCESS SKETCH) -->
    <g transform="translate(100, 160)" filter="url(#greenGlow)">
      <rect x="0" y="0" width="420" height="420" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="4" opacity="0.8" />
      <rect x="15" y="15" width="390" height="45" rx="8" fill="#047857" />
      <text x="30" y="44" fill="#ecfdf5" font-family="monospace" font-size="22" font-weight="bold">💻 LOCALHOST (My Laptop)</text>

      <g transform="translate(30, 80)">
        <text x="0" y="25" fill="#a7f3d0" font-family="monospace" font-size="16">• Residential ISP IP Address</text>
        <text x="0" y="55" fill="#a7f3d0" font-family="monospace" font-size="16">• Interactive Browser Traffic Profile</text>
        <text x="0" y="85" fill="#a7f3d0" font-family="monospace" font-size="16">• Direct Request Pipeline</text>

        <!-- Success Flow Sketch -->
        <rect x="10" y="120" width="340" height="150" rx="10" fill="#022c22" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4" />
        <text x="30" y="155" fill="#34d399" font-family="monospace" font-size="17">YouTube URL → Audio Stream</text>
        <text x="30" y="190" fill="#34d399" font-family="monospace" font-size="17">FFmpeg → Whisper API</text>
        <text x="30" y="225" fill="#6ee7b7" font-family="monospace" font-size="19" font-weight="bold">STATUS: ✅ 200 OK (Summary)</text>
      </g>
    </g>

    <!-- RIGHT CARD: PRODUCTION ENVIRONMENT (BLOCKED SKETCH) -->
    <g transform="translate(580, 160)" filter="url(#redGlow)">
      <rect x="0" y="0" width="420" height="420" rx="16" fill="#450a0a" stroke="#ef4444" stroke-width="4" opacity="0.85" />
      <rect x="15" y="15" width="390" height="45" rx="8" fill="#991b1b" />
      <text x="30" y="44" fill="#fef2f2" font-family="monospace" font-size="22" font-weight="bold">☁️ PRODUCTION (Cloud / Render)</text>

      <g transform="translate(30, 80)">
        <text x="0" y="25" fill="#fca5a5" font-family="monospace" font-size="16">• Shared Datacenter / Cloud IP</text>
        <text x="0" y="55" fill="#fca5a5" font-family="monospace" font-size="16">• Automated Request Signals</text>
        <text x="0" y="85" fill="#fca5a5" font-family="monospace" font-size="16">• Missing Interactive Session</text>

        <!-- Blocked Flow Sketch -->
        <rect x="10" y="120" width="340" height="150" rx="10" fill="#290707" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" />
        <text x="30" y="155" fill="#f87171" font-family="monospace" font-size="17">YouTube URL → Request</text>
        <text x="30" y="190" fill="#f87171" font-family="monospace" font-size="17">Bot Detection / Anti-Abuse</text>
        <text x="30" y="225" fill="#fca5a5" font-family="monospace" font-size="19" font-weight="bold">STATUS: ❌ Refused / Blocked</text>
      </g>
    </g>

    <!-- FAR RIGHT: 5 ATTEMPTS DIAGRAM SKETCH -->
    <g transform="translate(1060, 160)">
      <rect x="0" y="0" width="440" height="660" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="3" />
      <rect x="20" y="20" width="400" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <text x="35" y="52" fill="#f59e0b" font-family="monospace" font-size="20" font-weight="bold">🛠️ 5 Approaches Evaluated</text>

      <!-- Attempt items -->
      <g transform="translate(25, 95)" font-family="monospace" font-size="16">
        <!-- 1 -->
        <rect x="0" y="0" width="390" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <text x="15" y="30" fill="#38bdf8" font-weight="bold">1. yt-dlp library</text>
        <text x="15" y="60" fill="#94a3b8">Failed on Datacenter IP restrictions</text>

        <!-- 2 -->
        <rect x="0" y="105" width="390" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <text x="15" y="135" fill="#38bdf8" font-weight="bold">2. YouTube Transcript Pkg</text>
        <text x="15" y="165" fill="#94a3b8">Same underlying network dependency</text>

        <!-- 3 -->
        <rect x="0" y="210" width="390" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <text x="15" y="240" fill="#38bdf8" font-weight="bold">3. oEmbed Metadata API</text>
        <text x="15" y="270" fill="#94a3b8">Metadata works, but no video content</text>

        <!-- 4 -->
        <rect x="0" y="315" width="390" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <text x="15" y="345" fill="#38bdf8" font-weight="bold">4. Frontend Browser Fetch</text>
        <text x="15" y="375" fill="#94a3b8">Complex, CORS &amp; page scrap risk</text>

        <!-- 5 -->
        <rect x="0" y="420" width="390" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <text x="15" y="450" fill="#38bdf8" font-weight="bold">5. YouTube Data API v3</text>
        <text x="15" y="480" fill="#94a3b8">No universal transcript endpoint</text>
      </g>
    </g>

    <!-- BOTTOM DECISION BANNER SKETCH -->
    <g transform="translate(100, 620)">
      <rect x="0" y="0" width="900" height="200" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="4" />
      <text x="30" y="45" fill="#a5b4fc" font-family="monospace" font-size="22" font-weight="bold">🎯 Engineering Decision: Feature Paused</text>

      <path d="M30 65 h 840" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 4" />

      <text x="30" y="105" fill="#f8fafc" font-family="sans-serif" font-size="18">"Good engineering isn't about finding one more hack. It's knowing when</text>
      <text x="30" y="135" fill="#f8fafc" font-family="sans-serif" font-size="18">a third-party dependency compromises production reliability."</text>

      <rect x="30" y="150" width="460" height="34" rx="6" fill="#312e81" stroke="#a5b4fc" stroke-width="1.5" />
      <text x="45" y="173" fill="#cbd5e1" font-family="monospace" font-size="15">Primary Video Upload Pipeline = 100% Stable</text>
    </g>

  </g>
</svg>
