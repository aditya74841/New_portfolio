<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Next.js development performance</title>
  <desc id="desc">A stylized processor connected to a terminal window with a CPU usage graph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#263449"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172235"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 735C300 650 440 795 715 710s450-60 885 25v165H0Z" fill="#0b1220" opacity=".8"/>
  <g opacity=".14" stroke="#93c5fd" stroke-width="2">
    <path d="M80 90h1440M80 170h1440M80 250h1440M80 330h1440M80 410h1440M80 490h1440M80 570h1440"/>
    <path d="M150 40v600M300 40v600M450 40v600M600 40v600M750 40v600M900 40v600M1050 40v600M1200 40v600M1350 40v600M1500 40v600"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="170" y="160" width="760" height="485" rx="24" fill="url(#screen)" stroke="#475569" stroke-width="3"/>
    <rect x="170" y="160" width="760" height="72" rx="24" fill="#1e293b"/>
    <path d="M170 208h760" stroke="#475569" stroke-width="3"/>
    <circle cx="215" cy="196" r="10" fill="#fb7185"/>
    <circle cx="250" cy="196" r="10" fill="#fbbf24"/>
    <circle cx="285" cy="196" r="10" fill="#4ade80"/>
    <text x="355" y="204" fill="#94a3b8" font-family="monospace" font-size="22">npm run dev</text>
    <text x="225" y="300" fill="#60a5fa" font-family="monospace" font-size="27">$ next dev --webpack</text>
    <text x="225" y="350" fill="#a7f3d0" font-family="monospace" font-size="22">ready - started server on 0.0.0.0:3000</text>
    <text x="225" y="420" fill="#fbbf24" font-family="monospace" font-size="22">CPU   38%   memory   2.4 GB</text>
    <path d="M225 555L290 525 350 540 410 465 470 495 530 430 590 450 650 350 710 390 770 315 835 330" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1040 225)" filter="url(#shadow)">
    <rect x="70" y="0" width="280" height="280" rx="30" fill="#1e293b" stroke="#94a3b8" stroke-width="5"/>
    <rect x="115" y="45" width="190" height="190" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="5"/>
    <path d="M160 145l35 35 65-75" fill="none" stroke="#4ade80" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#94a3b8" stroke-width="10" stroke-linecap="round">
      <path d="M20 55h45M20 105h45M20 155h45M20 205h45M355 55h45M355 105h45M355 155h45M355 205h45"/>
      <path d="M125 -20v-45M175 -20v-45M225 -20v-45M275 -20v-45M125 300v45M175 300v45M225 300v45M275 300v45"/>
    </g>
  </g>
  <text x="1045" y="610" fill="#e2e8f0" font-family="sans-serif" font-size="48" font-weight="700">DEBUG THE TOOLCHAIN</text>
  <text x="1048" y="665" fill="#93c5fd" font-family="monospace" font-size="27">CPU ≠ memory</text>
</svg>
